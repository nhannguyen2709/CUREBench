# Model configuration
model:
  model_type: "custom"
  model_name: "Intelligent-Internet/II-Medical-8B-1706"
  base_model_type: "OpenWeighted" # API or OpenWeighted
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"

  sampling:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 40960
    reasoning:
      effort: "high"
    
  enable_thinking: true

# Search Agent configuration
search_agent:
  # Enable/disable search agent (set to true to force use of search agent)
  enabled: false  # Set to true to use search agent for inference
  
  # Model config for search agent (can override main model settings)
  model:
    model_name: ${model.model_name}  # Search agent specific model
    base_url: ${model.base_url}  # Reuse from main model config
    api_key: ${model.api_key}  # Reuse from main model config
    
  # API endpoints for search functionality
  api:
    search_url: "http://10.100.20.26:10000/search"
    visit_url: "http://10.100.20.26:10000/visit"
    
  # Timeout settings (in seconds)
  timeouts:
    search: 30
    visit: 60
    
  # Search agent behavior
  max_turns: 20  # Maximum number of conversation turns
  per_turn_max_tokens: ${div:${model.sampling.max_tokens},${search_agent.max_turns}}
  default_num_results: 10  # Default number of search results
    
  # System prompt for search agent
  system_prompt: |
    You are a helpful assistant. Your tasks are to perform multi-turn searches, visits and provide comprehensive answers to questions in medical domain.

    **Instructions**
    1. First always think to provide reasoning, arguments, and procedural steps for the functions you will use next.
    2. Use web_search which requires a search query to get information from a web page. If the information is not relevant to the query, you could search again with another search query.
    3. Use web_visit to get detailed content from a specific URL.
    4. Reason through the information systematically.
    5. Provide a comprehensive final answer.

    **Answering Tips**
    1. Please strictly follow the output format expected by the user.
    2. Never start the final response with "Based on my research" or "Now I have enough information".
    
  # Interactive mode commands
  interactive_commands:
    exit: "Quit the program"
    history: "View search history"
    reset: "Clear conversation history"

# Dataset configuration
dataset:
  name: "cure_bench_phase_1"
  path: "data/curebench_valset_nooe.jsonl"
  description: "CureBench 2025 validation questions"
  track: "internal_reasoning"

# Evaluation settings
evaluation:
  max_workers: 4
  batch_size: 1
  subset_size: null  # null means use all examples

# Output configuration
output:
  dir: "results"
  file: "submission.csv"
  additional_info: "Unified YAML configuration"

# Hydra configuration
hydra:
  run:
    dir: ./hydra_outputs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./hydra_multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra:job.num}
